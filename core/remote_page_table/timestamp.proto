syntax="proto3";
option cc_generic_services = true;

package timestamp_service;

message GetTimeStampRequest {
}

message GetTimeStampResponse {
    uint64 timestamp = 1;
};

message WorkloadKey {
    int32 table_id = 1;
    uint64 key = 2;
}

message WorkloadLockRequest {
    int32 node_id = 1;
    uint64 tx_id = 2;
    string generation = 3;
    repeated WorkloadKey keys = 4;
    bool release = 5;
    // 第 15 层（R2 live fault）：victim 节点被 SIGKILL 时其 in-flight 事务
    // 持有的 workload key 锁无人释放，remote 侧 owner 表无死节点回收，
    // 后续所有撞上该 key 的请求确定性 KEY_CONFLICT（fault-0524：B 读
    // 600018 预期成功）。幸存节点恢复完成时通过 evict_mode 请求 remote
    // 清除死亡节点持有的全部 workload key 锁。
    bool evict_mode = 6;
    int32 evict_node_id = 7;
}

message WorkloadLockResponse {
    bool granted = 1;
}

service TimeStampService {
    rpc GetTimeStamp(GetTimeStampRequest) returns (GetTimeStampResponse);
    rpc WorkloadLock(WorkloadLockRequest) returns (WorkloadLockResponse);
};