syntax="proto3";
option cc_generic_services = true;

package page_table_service;

message PageID{
    sint32 page_no = 1;
    int32 table_id = 2;
}

message PXLockRequest {
    PageID page_id = 1;
    sint32 node_id = 2;
};

message PXLockResponse{
    sint32 newest_node = 1; // 返回最新的数据页所在节点, 如果当前已经是最新的, 则返回-1
    PageID page_id = 2;
    bool wait_lock_release = 3; // 如果返回为true，则加锁不成功
    bool need_storage_fetch = 4;   // 是否需要去存储层获取数据
    uint64 lsn = 5;
    bool ir_locked = 6;   // Instance Recovery 锁，故障恢复期间
}

message PXUnlockRequest {
    PageID page_id = 1;
    sint32 node_id = 2;
};

message PXUnlockResponse{}

message PSLockRequest {
    PageID page_id = 1;
    sint32 node_id = 2;
};

message PSLockResponse{
    sint32 newest_node = 1; // 返回最新的数据页所在节点, 如果当前已经是最新的, 则返回-1
    PageID page_id = 2;
    bool wait_lock_release = 3; //  如果返回为true，则加锁不成功
    bool need_storage_fetch = 4; // 返回 true 代表需要向 storage 拉取数据
    uint64 lsn = 5;
    bool ir_locked = 6;   // Instance Recovery 锁，故障恢复期间
}

message PSUnlockRequest {
    PageID page_id = 1;
    sint32 node_id = 2;
};

message PSUnlockResponse{}

// 不指定远程加锁类型，将服务端该节点锁释放
message PAnyUnLockRequest {
    PageID page_id = 1;
    sint32 node_id = 2;
};

message PAnyUnLocksRequest {
    repeated PageID pages_id = 1;
    sint32 node_id = 2;
}
message PAnyUnLockResponse{}

message BufferReleaseUnlockRequest {
    PageID page_id = 1;
    sint32 node_id = 2;
    uint64 lsn = 3;
};
message BufferReleaseUnlockResponse {
    bool agree = 1; // 是否允许释放这个页面
};

// ==================== Instance Recovery ====================
// 存活节点向新的 GPLM 管理者汇报页面状态
message ReportPageStatusRequest {
    PageID page_id = 1;
    sint32 reporter_node_id = 2;    // 汇报节点
    int32 lock_mode = 3;            // LPLM 中的远程锁模式: 0=NONE, 1=SHARED, 2=EXCLUSIVE
    bool has_valid_copy = 4;        // 是否持有有效页面副本
}

message ReportPageStatusResponse {
    bool ir_released = 1;           // IR 锁是否已释放
}

// 存活节点通知：自身已完成故障恢复扫描
message IRScanCompleteRequest {
    sint32 reporter_node_id = 1;    // 完成扫描的节点
    sint32 failed_node_id = 2;     // 故障节点
}

message IRScanCompleteResponse {}


service PageTableService {
    rpc PXLock(PXLockRequest) returns (PXLockResponse);
    rpc PXUnlock(PXUnlockRequest) returns (PXUnlockResponse);
    rpc PSLock(PSLockRequest) returns (PSLockResponse);
    rpc PSUnlock(PSUnlockRequest) returns (PSUnlockResponse);

    // for lazy release
    rpc LRPXLock(PXLockRequest) returns (PXLockResponse);
    rpc LRPXUnlock(PXUnlockRequest) returns (PXUnlockResponse);
    rpc LRPSLock(PSLockRequest) returns (PSLockResponse); // unused now 
    rpc LRPSUnlock(PSUnlockRequest) returns (PSUnlockResponse); // unused now 
    rpc LRPAnyUnLock(PAnyUnLockRequest) returns (PAnyUnLockResponse);
    rpc LRPAnyUnLocks(PAnyUnLocksRequest) returns (PAnyUnLockResponse);
    rpc BufferReleaseUnlock(BufferReleaseUnlockRequest) returns (BufferReleaseUnlockResponse);

    // Instance Recovery
    rpc ReportPageStatus(ReportPageStatusRequest) returns (ReportPageStatusResponse);
    rpc IRScanComplete(IRScanCompleteRequest) returns (IRScanCompleteResponse);
}