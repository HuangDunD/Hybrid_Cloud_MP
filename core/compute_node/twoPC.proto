syntax="proto3";
option cc_generic_services = true;

package twopc_service;

message ItemID{
    sint32 table_id = 1;
    sint32 page_no = 2;
    sint32 slot_id = 3;
    bool lock_data = 4;
}

// Fixed home Context of the transaction. Every participant request carries the
// same epoch/home/local_id/snapshot_ts; a participant never re-Begins.
message MvccContext {
    bytes epoch = 1;
    sint32 home = 2;
    uint64 local_id = 3;
    uint64 snapshot_ts = 4;
}

message GetDataItemRequest {
    ItemID item_id = 1;
    uint64 transaction_id = 2;
    uint64 start_ts = 3;
    sint32 requester_node = 4;
    MvccContext mvcc = 5;
};

message GetDataItemResponse {
    // Record-sized DataItem followed by its value. For an S read this is the
    // version visible at the fixed snapshot, never the raw newest page row.
    bytes data = 1;
    bool abort = 2;
    // 锁冲突时：当前持锁事务的 start_ts
    uint64 holder_ts = 3;
    // 锁冲突时：持锁事务所在节点
    sint32 txn_home_node = 4;
    // The visible version at snapshot_ts is a tombstone.
    bool not_found = 5;
    // Participant-side snapshot write conflict (newer committed version).
    bool mvcc_conflict = 6;
    bool undo_full = 7;  // append-only undo admission refused this write
};

message WriteDataItemRequest {
    ItemID item_id = 1;
    bytes data = 2;
};

message WriteDataItemResponse {};

// Only the multi-writer 2PC path uses this protocol. A complete PREPARED
// log record containing this request is this participant's durable YES.
message TxnIdentity {
    sint32 coordinator_node = 1;
    bytes coordinator_incarnation = 2; // 128 random bits, once per process
    uint64 local_tx_id = 3;
}

message PreparedWrite {
    enum Operation { UNSUPPORTED = 0; UPDATE = 1; }
    ItemID item_id = 1;
    string table_name = 2; // stable recovery name, not just an in-memory ID
    uint64 key = 3;
    Operation operation = 4;
    bytes value = 5; // business after-image only; no DataItem/lock/pointer bytes
    // Encoded undo::Ref of the complete pre-image this write will overwrite.
    // Empty only for non-MVCC callers.
    bytes undo = 6;
    // Business tombstone at install; DataItem.valid == 0.
    bool deleted = 7;
}

message PrepareRequest {
    uint64 transaction_id = 1;
    uint32 protocol_version = 2;
    TxnIdentity identity = 3;
    uint64 start_ts = 4;
    uint64 commit_ts = 5;
    repeated sint32 participants = 6; // sorted, unique, complete writer set
    sint32 participant_node = 7;
    repeated PreparedWrite writes = 8;
    MvccContext mvcc = 9;
    enum DecisionRule { LEGACY = 0; COORDINATOR_BACKUP = 1; ALL_YES = 2; }
    DecisionRule decision_rule = 10;
};

message PrepareResponse {
    bool ok = 1;
    CommitCostTelemetry cost = 2;
    // Participant prepare prefix, including this transaction's undo redo.
    uint64 durable_lsn = 3;
};

message CommitRequest {
    uint64 transaction_id = 1;
    repeated ItemID item_id = 2;
    repeated bytes data = 3; 
    uint64 commit_ts = 4;
    enum Kind { LEGACY = 0; PREPARED = 1; }
    Kind kind = 5;
    TxnIdentity identity = 6;
    uint64 start_ts = 7;
    reserved 8; // A participant installs its rows before the home allocates C.
    MvccContext mvcc = 9;
    // Per-item business tombstone, parallel to item_id/data.
    repeated bool deleted = 10;
};

message CommitResponse {
    bool ok = 1;
    uint32 latency_commit = 2;
    CommitCostTelemetry cost = 3;
    // Durable through the final row install on this participant.
    uint64 durable_lsn = 4;
    // All items of this participant were installed and their row locks are
    // still held; the lock is released only by Release after publication.
    bool installed = 5;
};

// Sent only after the whole transaction was published. It hands each written
// row's lock to waiters and drains the participant's imported snapshot.
message ReleaseRequest {
    uint64 transaction_id = 1;
    uint64 start_ts = 2;
    MvccContext mvcc = 3;
    uint64 commit_ts = 4;
    repeated ItemID item_id = 5;
    // Which participant registry recorded this transaction's commit; selects
    // the idempotency check for repeated Release. PREPARED releases also carry
    // the coordinator identity because that registry is keyed by incarnation.
    bool prepared = 6;
    // Drain without an applied write set: only end the imported snapshot.
    bool finish_only = 7;
    TxnIdentity identity = 8;
};

message ReleaseResponse { bool ok = 1; };

// Advisory statistics only; never interpreted as a durability/protocol flag.
// Durations use each sender's monotonic clock. No cross-host timestamp subtraction.
message CommitCostTelemetry {
    uint32 version = 1;
    uint64 handler_ns = 2;
    bool log_valid = 3;
    double log_mean_ms = 4;
    repeated double log_phase_ms = 5; // Commit, Prepare, Backup; aggregate fallback if cold
    uint64 log_samples = 6;
    uint64 log_age_ns = 7;
}

// Storage sends this only after every listed writer's complete PREPARED
// record has crossed the durability barrier. It carries no new commit decision.
message AllPreparedRequest {
    uint32 protocol_version = 1;
    TxnIdentity identity = 2;
    uint64 start_ts = 3;
    uint64 commit_ts = 4;
    repeated sint32 participants = 5;
    PrepareRequest.DecisionRule decision_rule = 6;
}
message AllPreparedResponse { bool ok = 1; }

message AbortRequest {
    uint64 transaction_id = 1;
    repeated ItemID item_id = 2;
    // Present when this transaction exported an execution to the participant.
    MvccContext mvcc = 3;
};

message AbortResponse {
    bool ok = 1;
};

service TwoPCService {
    rpc AllPrepared(AllPreparedRequest) returns (AllPreparedResponse);
    rpc GetDataItem(GetDataItemRequest) returns (GetDataItemResponse);
    rpc WriteDataItem(WriteDataItemRequest) returns (WriteDataItemResponse);
    rpc Prepare(PrepareRequest) returns (PrepareResponse);
    rpc Commit(CommitRequest) returns (CommitResponse);
    rpc Release(ReleaseRequest) returns (ReleaseResponse);
    rpc Abort(AbortRequest) returns (AbortResponse);
};
