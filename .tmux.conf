# ============================================
# Tmux 配置文件 - 适用于多节点管理
# ============================================

# --- 基础设置 ---
# 设置前缀键为 Ctrl+A（比默认的 Ctrl+B 更顺手）
# 如果不习惯可以注释掉下面两行，保持默认 Ctrl+B
# set -g prefix C-a
# unbind C-b

# 开启鼠标支持（可以点击切换窗口、拖拽调整分屏大小、滚动查看历史）
set -g mouse on

# 设置历史缓冲区大小（方便回看节点输出日志）
set -g history-limit 50000

# 减少 ESC 延迟
set -sg escape-time 10

# 窗口编号从 1 开始（0 离手太远）
# set -g base-index 1
# setw -g pane-base-index 1

# 窗口关闭后自动重新编号
set -g renumber-windows on

# --- 快捷键设置 ---
# Alt+数字 快速切换窗口（无需前缀键）
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+左/右 切换上/下一个窗口
bind -n M-Left previous-window
bind -n M-Right next-window

# Alt+上/下 切换上/下一个 pane
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 前缀键 + T 一键平铺所有 pane
bind T select-layout tiled

# 前缀键 + r 重新加载配置
bind r source-file ~/.tmux.conf \; display-message "配置已重新加载!"

# 前缀键 + | 和 - 分屏（更直观）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 前缀键 + s 同步所有 pane 输入（调试时有用）
bind s setw synchronize-panes

# --- 状态栏美化 ---
# 状态栏位置
set -g status-position bottom

# 状态栏刷新间隔（秒）
set -g status-interval 2

# 状态栏背景色
set -g status-style 'bg=colour235 fg=colour255'

# 左侧显示会话名
set -g status-left-length 30
set -g status-left '#[fg=colour232,bg=colour39,bold] #S #[default] '

# 右侧显示时间
set -g status-right-length 50
set -g status-right '#[fg=colour255,bg=colour238] %Y-%m-%d %H:%M:%S '

# 窗口列表样式（未选中）
set -g window-status-format '#[fg=colour250,bg=colour236] #I:#W '

# 窗口列表样式（当前选中，蓝色高亮）
set -g window-status-current-format '#[fg=colour255,bg=colour27,bold] #I:#W '

# 窗口活动提示
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style 'fg=colour255,bg=colour196,bold'

# --- 分屏边框样式 ---
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39'

# --- 消息样式 ---
set -g message-style 'fg=colour255,bg=colour27,bold'
